<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Hidrologia Aplicada à Agricultura</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
    color: #263238;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 30px 15px;
  }
  .quiz {
    width: 100%;
    max-width: 800px;
    background: white;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
  }
  h1 { margin-top: 0; color: #2e7d32; text-align: center; }
  .subtitle { text-align: center; color: #607d8b; margin-bottom: 25px; }
  .progress {
    height: 10px;
    background: #e0e0e0;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 25px;
  }
  .progress-bar {
    height: 100%;
    width: 5%;
    background: #43a047;
    transition: width .3s;
  }
  .question-number { font-weight: bold; color: #388e3c; }
  h2 { font-size: 1.3rem; line-height: 1.5; }
  .options { display: grid; gap: 12px; margin-top: 20px; }
  .option {
    border: 2px solid #d7e8d8;
    background: #fafafa;
    padding: 15px;
    border-radius: 10px;
    cursor: pointer;
    transition: .2s;
    font-size: 1rem;
  }
  .option:hover { border-color: #66bb6a; background: #f1f8f2; }
  .option.selected { border-color: #2e7d32; background: #e8f5e9; }
  button {
    margin-top: 25px;
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: #2e7d32;
    color: white;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: #1b5e20; }
  button:disabled { background: #bdbdbd; cursor: not-allowed; }
  .result { text-align: center; }
  .score { font-size: 3rem; color: #2e7d32; font-weight: bold; }
  .review { margin-top: 25px; text-align: left; }
  .review-item {
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 10px;
    background: #f5f5f5;
  }
  .correct { border-left: 5px solid #43a047; }
  .wrong { border-left: 5px solid #e53935; }
  .explanation { color: #546e7a; font-size: .95rem; margin-top: 7px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="quiz">
  <div id="quiz-screen">
    <h1>🌱 Quiz de Hidrologia Aplicada à Agricultura</h1>
    <p class="subtitle">20 questões • 4 alternativas • uma resposta correta</p>
    <div class="progress"><div class="progress-bar" id="progress"></div></div>
    <div class="question-number" id="question-number"></div>
    <h2 id="question"></h2>
    <div class="options" id="options"></div>
    <button id="next" disabled>Próxima questão</button>
  </div>

  <div id="result-screen" class="result hidden">
    <h1>🌾 Resultado</h1>
    <p>Você acertou:</p>
    <div class="score" id="score"></div>
    <p id="message"></p>
    <button onclick="restart()">Refazer quiz</button>
    <div class="review" id="review"></div>
  </div>
</div>

<script>
const questions = [
  {
    q: "1. O que é hidrologia?",
    a: ["Ciência que estuda apenas os rios", "Ciência que estuda a água, sua ocorrência, circulação e distribuição", "Estudo exclusivo da irrigação", "Estudo dos solos agrícolas"],
    c: 1,
    e: "A hidrologia estuda a água na Terra, incluindo sua ocorrência, circulação, distribuição e propriedades."
  },
  {
    q: "2. Qual processo representa a passagem da água líquida da superfície para a atmosfera?",
    a: ["Precipitação", "Infiltração", "Evapotranspiração", "Condensação"],
    c: 2,
    e: "A evapotranspiração reúne a evaporação da água e a transpiração das plantas."
  },
  {
    q: "3. A infiltração é o processo pelo qual:",
    a: ["A água entra no solo a partir da superfície", "A água retorna da atmosfera em forma de chuva", "A água escoa sobre o solo", "A água evapora das folhas"],
    c: 0,
    e: "Infiltração é a entrada da água no solo através da superfície."
  },
  {
    q: "4. Qual fator tende a aumentar a infiltração de água no solo?",
    a: ["Solo compactado", "Cobertura vegetal e boa estrutura do solo", "Superfície totalmente impermeabilizada", "Tráfego intenso de máquinas"],
    c: 1,
    e: "A cobertura vegetal e uma boa estrutura favorecem a entrada da água e reduzem a formação de escoamento superficial."
  },
  {
    q: "5. O que é escoamento superficial?",
    a: ["Água que se movimenta sobre a superfície do solo", "Água armazenada em aquíferos", "Água absorvida pelas raízes", "Água presente somente na atmosfera"],
    c: 0,
    e: "É o fluxo de água que ocorre sobre a superfície quando a precipitação excede a capacidade de infiltração ou quando o solo está saturado."
  },
  {
    q: "6. Em agricultura, a evapotranspiração é importante principalmente para:",
    a: ["Determinar a necessidade de irrigação das culturas", "Medir somente a textura do solo", "Calcular a quantidade de sementes", "Determinar a acidez da água"],
    c: 0,
    e: "A evapotranspiração é fundamental para estimar o consumo de água das culturas e o manejo da irrigação."
  },
  {
    q: "7. O que significa capacidade de campo?",
    a: ["Quantidade máxima de chuva em um dia", "Quantidade de água retida no solo após o excesso de água gravitacional ter drenado", "Quantidade de água presente em um rio", "Volume de água perdido por evaporação"],
    c: 1,
    e: "A capacidade de campo representa, de forma simplificada, a água que permanece no solo após a drenagem do excesso gravitacional."
  },
  {
    q: "8. O ponto de murcha permanente corresponde à condição em que:",
    a: ["O solo está completamente seco", "A planta não consegue recuperar a turgescência mesmo após condições adequadas de umidade", "A chuva está começando", "O solo está saturado"],
    c: 1,
    e: "No ponto de murcha permanente, a água disponível para a planta é insuficiente para que ela se recupere da murcha."
  },
  {
    q: "9. A água disponível às plantas é, de maneira geral, relacionada à diferença entre:",
    a: ["Precipitação e chuva", "Capacidade de campo e ponto de murcha permanente", "Evaporação e temperatura", "Infiltração e escoamento de um rio"],
    c: 1,
    e: "A água disponível é aproximadamente a água retida entre a capacidade de campo e o ponto de murcha permanente."
  },
  {
    q: "10. Qual instrumento é utilizado para medir a precipitação?",
    a: ["Termômetro", "Pluviômetro", "Anemômetro", "Higrômetro"],
    c: 1,
    e: "O pluviômetro mede a quantidade de precipitação ocorrida em determinado período."
  },
  {
    q: "11. O que é uma bacia hidrográfica?",
    a: ["Uma área drenada por um curso d'água e seus afluentes", "Apenas a área ocupada pelo rio principal", "Um reservatório artificial", "Uma área exclusivamente agrícola"],
    c: 0,
    e: "A bacia hidrográfica é uma área delimitada pelo relevo na qual a água escoa para um ponto de saída comum."
  },
  {
    q: "12. Qual prática agrícola ajuda a reduzir o escoamento superficial e a erosão?",
    a: ["Plantio em curvas de nível", "Solo descoberto", "Queima da palhada", "Aumento do tráfego de máquinas"],
    c: 0,
    e: "O plantio em curvas de nível reduz a velocidade do escoamento e ajuda a controlar a erosão."
  },
  {
    q: "13. O que caracteriza um solo saturado?",
    a: ["Todos os poros estão, ou praticamente estão, preenchidos por água", "Todos os poros estão preenchidos por ar", "Não existe água no solo", "Apenas as raízes possuem água"],
    c: 0,
    e: "Na saturação, a maior parte dos poros do solo está preenchida por água."
  },
  {
    q: "14. A irrigação tem como principal objetivo:",
    a: ["Aumentar a salinidade do solo", "Fornecer água às culturas quando a precipitação não atende à demanda", "Eliminar toda a água do solo", "Substituir a adubação"],
    c: 1,
    e: "A irrigação complementa a precipitação para atender às necessidades hídricas das culturas."
  },
  {
    q: "15. Qual método de irrigação aplica água diretamente próximo à região das raízes, com alta eficiência potencial?",
    a: ["Irrigação por inundação", "Irrigação por sulcos", "Irrigação localizada por gotejamento", "Irrigação natural"],
    c: 2,
    e: "O gotejamento aplica água de forma localizada, próximo às raízes, podendo apresentar alta eficiência de aplicação."
  },
  {
    q: "16. O que pode acontecer quando a irrigação é excessiva?",
    a: ["Sempre aumenta a produtividade", "Pode causar encharcamento, lixiviação de nutrientes e desperdício de água", "Elimina a necessidade de drenagem", "Impede qualquer perda de água"],
    c: 1,
    e: "O excesso de irrigação pode provocar encharcamento, perdas de nutrientes por lixiviação e desperdício."
  },
  {
    q: "17. A drenagem agrícola é utilizada principalmente para:",
    a: ["Retirar o excesso de água do solo", "Aumentar o encharcamento", "Impedir a infiltração", "Reduzir a precipitação"],
    c: 0,
    e: "A drenagem controla o excesso de água no perfil do solo, favorecendo condições adequadas para as culturas."
  },
  {
    q: "18. Qual condição tende a aumentar a evapotranspiração?",
    a: ["Temperaturas mais elevadas e maior disponibilidade de energia", "Ausência total de radiação solar", "Temperatura muito baixa e ar saturado", "Solo permanentemente congelado"],
    c: 0,
    e: "Temperatura elevada e maior disponibilidade de energia, entre outros fatores, tendem a favorecer a evapotranspiração."
  },
  {
    q: "19. O que é água subterrânea?",
    a: ["Água armazenada abaixo da superfície terrestre em zonas saturadas", "Somente água presente nas folhas", "Água que existe apenas em nuvens", "Água presente exclusivamente em rios"],
    c: 0,
    e: "A água subterrânea ocupa poros e fraturas do subsolo, especialmente nas zonas saturadas."
  },
  {
    q: "20. Para um bom manejo da água na agricultura, é importante:",
    a: ["Irrigar sempre no máximo possível", "Ignorar a previsão de chuva", "Relacionar a necessidade da cultura, as condições do solo e a disponibilidade de água", "Manter o solo sempre saturado"],
    c: 2,
    e: "O manejo eficiente considera a demanda da cultura, o armazenamento de água no solo, a chuva e a disponibilidade hídrica."
  }
];

let current = 0;
let selected = null;
let answers = [];

const qEl = document.getElementById("question");
const numEl = document.getElementById("question-number");
const optionsEl = document.getElementById("options");
const nextBtn = document.getElementById("next");
const progress = document.getElementById("progress");

function loadQuestion() {
  selected = null;
  nextBtn.disabled = true;
  const item = questions[current];
  numEl.textContent = `Questão ${current + 1} de ${questions.length}`;
  qEl.textContent = item.q;
  progress.style.width = `${((current + 1) / questions.length) * 100}%`;
  optionsEl.innerHTML = "";

  item.a.forEach((answer, index) => {
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = `${String.fromCharCode(65 + index)}) ${answer}`;
    div.onclick = () => {
      document.querySelectorAll(".option").forEach(x => x.classList.remove("selected"));
      div.classList.add("selected");
      selected = index;
      nextBtn.disabled = false;
    };
    optionsEl.appendChild(div);
  });

  nextBtn.textContent = current === questions.length - 1 ? "Finalizar quiz" : "Próxima questão";
}

nextBtn.onclick = () => {
  answers[current] = selected;
  if (current < questions.length - 1) {
    current++;
    loadQuestion();
  } else {
    showResult();
  }
};

function showResult() {
  document.getElementById("quiz-screen").classList.add("hidden");
  document.getElementById("result-screen").classList.remove("hidden");

  const correct = answers.filter((a, i) => a === questions[i].c).length;
  document.getElementById("score").textContent = `${correct}/20`;

  let message;
  if (correct >= 18) message = "Excelente! Você está muito bem em Hidrologia Aplicada. 🌟";
  else if (correct >= 14) message = "Muito bom! Você já tem uma boa base. 🌱";
  else if (correct >= 10) message = "Bom começo! Vale revisar alguns conceitos. 📚";
  else message = "Continue estudando! A revisão dos conceitos básicos vai ajudar bastante. 💧";
  document.getElementById("message").textContent = message;

  const review = document.getElementById("review");
  review.innerHTML = "<h2>Revisão das respostas</h2>";

  questions.forEach((item, i) => {
    const div = document.createElement("div");
    const ok = answers[i] === item.c;
    div.className = `review-item ${ok ? "correct" : "wrong"}`;
    div.innerHTML = `
      <strong>${item.q}</strong><br>
      Sua resposta: ${answers[i] !== undefined ? item.a[answers[i]] : "Não respondida"}<br>
      Resposta correta: ${item.a[item.c]}
      <div class="explanation">${item.e}</div>
    `;
    review.appendChild(div);
  });
}

function restart() {
  current = 0;
  selected = null;
  answers = [];
  document.getElementById("result-screen").classList.add("hidden");
  document.getElementById("quiz-screen").classList.remove("hidden");
  loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
